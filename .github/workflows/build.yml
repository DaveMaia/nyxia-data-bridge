name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk liblzma-dev
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify CLI JSON output
        run: |
          python cli.py list --json

  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NyxiaDataBridge" --icon "app_icon.ico" --add-data "nyxia_logo.png;." --add-data "header_icon.png;." --add-data "app_icon.ico;." --add-data "app_icon.png;." --collect-all customtkinter --collect-all py7zr app.py
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NyxiaDataBridge.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
